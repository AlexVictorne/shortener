version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: shortener_postgres
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      - postgres
    volumes:
      - ./migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 5 && migrate -path=/migrations -database 'postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable' up"
volumes:
  postgres_data:
